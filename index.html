<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENTO Barcode Product Entry</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
:root{--b:#2563eb;--bg:#f5f7fb;--line:#dfe5ee;--text:#111827;--muted:#64748b;--green:#059669;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,sans-serif}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}.logo{width:37px;height:37px;border-radius:10px;background:var(--b);color:#fff;display:grid;place-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:700;color:#334155;cursor:pointer;text-decoration:none}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.danger{color:var(--red)}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}.grid{display:grid;grid-template-columns:410px 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.card h2{font-size:18px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.camera{margin-top:16px;aspect-ratio:4/3;background:#0f172a;border-radius:13px;overflow:hidden;display:grid;place-items:center;position:relative;color:#cbd5e1;text-align:center}.camera video{width:100%;height:100%;object-fit:cover}.scanline{display:none;position:absolute;left:8%;right:8%;height:2px;background:#22c55e;box-shadow:0 0 12px #22c55e;animation:scan 1.8s infinite}.camera.on .scanline{display:block}@keyframes scan{0%,100%{top:18%}50%{top:82%}}.actions,.manual{display:flex;gap:8px;margin-top:11px}.actions .btn{flex:1}.field{width:100%;padding:11px 12px;border:1px solid #cfd7e3;border-radius:9px;outline:none}.field:focus{border-color:var(--b);box-shadow:0 0 0 3px #dbeafe}.mono{font-family:"JetBrains Mono",monospace}.status{margin-top:12px;padding:11px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:12px}.status.ok{background:#ecfdf5;color:var(--green)}.status.err{background:#fef2f2;color:var(--red)}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.group label{display:block;color:var(--muted);font-size:10px;font-weight:800;margin-bottom:6px;text-transform:uppercase}.full{grid-column:1/-1}.preview{height:145px;border:1px dashed #cbd5e1;border-radius:11px;display:grid;place-items:center;color:#94a3b8;overflow:hidden;background:#f8fafc}.preview img{width:100%;height:100%;object-fit:contain}.savebar{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:17px;padding-top:16px}.found{display:none;padding:10px 12px;background:#fffbeb;color:#92400e;border-radius:9px;margin-bottom:13px;font-size:12px}.found.on{display:block}@media(max-width:820px){.grid{grid-template-columns:1fr}.top{padding:0 12px}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header class="top"><div class="brand"><span class="logo">Z</span>ZENTO Barcode Entry</div><a class="btn" href="POS.HTML"><i class="fa fa-arrow-left"></i> Back to POS</a></header>
<main class="wrap"><div class="grid">
<section class="card"><h2><i class="fa fa-barcode"></i> Scan Product Barcode</h2><div class="muted">Camera, USB barcode reader, or manual barcode entry.</div><div class="camera" id="camera"><video id="video" playsinline muted></video><div class="scanline"></div><span id="cameraEmpty"><i class="fa fa-camera" style="font-size:34px"></i><br><small>Camera stopped</small></span></div><div class="actions"><button class="btn primary" onclick="startCamera()"><i class="fa fa-camera"></i> Start Camera</button><button class="btn danger" onclick="stopCamera()"><i class="fa fa-stop"></i> Stop</button></div><div class="manual"><input class="field mono" id="scanInput" autocomplete="off" placeholder="Scan or type barcode" onkeydown="if(event.key==='Enter')useBarcode(this.value)"><button class="btn primary" onclick="useBarcode(scanInput.value)">Find</button></div><div class="status" id="status">Ready. Scan a barcode to start.</div></section>
<section class="card"><h2 id="formTitle">Add Scanned Product</h2><div class="muted" style="margin-bottom:14px">Saves directly to POS Products, Pricing & Inventory.</div><div class="found" id="found"><i class="fa fa-circle-info"></i> Existing product found. You can change its photo and details.</div><input type="hidden" id="productId"><div class="form">
<div class="group"><label>Barcode / SKU *</label><input class="field mono" id="barcode"></div><div class="group"><label>Item Code *</label><input class="field mono" id="itemCode"></div><div class="group"><label>Visible Name (EN) *</label><input class="field" id="name"></div><div class="group"><label>Dhivehi Name</label><input class="field" id="nameDv" dir="rtl"></div><div class="group"><label>Category *</label><select class="field" id="category"><option value="">Loading…</option></select></div><div class="group"><label>GST Rate</label><input class="field" id="gst" readonly></div><div class="group full"><label>Image URL</label><input class="field" id="imageUrl" type="url" placeholder="https://" oninput="showPreview()"></div><div class="group full"><label>Upload Product Photo</label><input class="field" id="imageFile" type="file" accept="image/*" onchange="localPreview()"></div><div class="group full"><div class="preview" id="preview"><i class="fa fa-image" style="font-size:30px"></i></div></div><div class="group full"><label>Description</label><textarea class="field" id="description" rows="4"></textarea></div></div><div class="savebar"><button class="btn" onclick="clearForm()">Clear</button><button class="btn primary" id="saveBtn" onclick="saveProduct()"><i class="fa fa-floppy-disk"></i> Save to POS Products</button></div></section>
</div></main>
<script>
const firebaseConfig={apiKey:"AIzaSyCV4danc7NH3BfsQCxF2nuS0iV_V1aoQe0",authDomain:"symcodermv-cba04.firebaseapp.com",databaseURL:"https://symcodermv-cba04-default-rtdb.firebaseio.com",projectId:"symcodermv-cba04",storageBucket:"symcodermv-cba04.firebasestorage.app",messagingSenderId:"432074388052",appId:"1:432074388052:web:07ec04181e2af980b2b3c1"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),storage=firebase.storage(),$=id=>document.getElementById(id);let products=[],categories=[],gstRate=0,stream=null,timer=null,detector=null,last="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function msg(t,c=""){$("status").textContent=t;$("status").className="status "+c}
db.ref("shop/products").on("value",s=>products=s.exists()?Object.entries(s.val()).filter(x=>x[1]).map(x=>({...x[1],_key:x[0]})):[]);
db.ref("shop/categories").on("value",s=>{categories=s.exists()?Object.entries(s.val()).filter(x=>x[1]).map(x=>({...x[1],_key:x[0]})):[];let v=$("category").value;$("category").innerHTML='<option value="">Select category</option>'+categories.map(c=>`<option value="${c._key}">${esc(c.name)}</option>`).join("");$("category").value=v});
db.ref("shop/settings/gstRate").on("value",s=>{$("gst").value=(gstRate=Number(s.val()||0))+"%"});
async function startCamera(){if(!("BarcodeDetector"in window)){msg("Camera scanning needs Chrome/Android. You can use a USB scanner or type the barcode.","err");return $("scanInput").focus()}try{detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code"]});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});$("video").srcObject=stream;await $("video").play();$("camera").classList.add("on");$("cameraEmpty").style.display="none";msg("Camera active. Hold the barcode inside the frame.");scan()}catch(e){msg("Cannot open camera: "+e.message,"err")}}
async function scan(){if(!stream)return;try{let r=await detector.detect($("video"));if(r[0]&&r[0].rawValue!==last){last=r[0].rawValue;useBarcode(last);navigator.vibrate?.(100)}}catch(e){}timer=requestAnimationFrame(scan)}
function stopCamera(){if(timer)cancelAnimationFrame(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null;$("camera").classList.remove("on");$("cameraEmpty").style.display="block"}
async function useBarcode(v){let code=String(v||"").trim();if(!code)return msg("Enter a barcode first.","err");$("scanInput").value=$("barcode").value=code;let p=products.find(x=>String(x.barcode||x.sku||"")===code);if(p){load(p);return msg("Existing ZENTO product loaded with its name and image.","ok")}$("productId").value="";$("found").classList.remove("on");$("formTitle").textContent="Add Scanned Product";$("itemCode").value=code;msg("Searching online for product name and image…");await lookupProduct(code)}
async function lookupProduct(code){try{let url=`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_en,generic_name,brands,image_front_url,image_url,categories_tags`,res=await fetch(url),data=await res.json(),p=data.product;if(!res.ok||data.status!==1||!p){$("name").focus();return msg("Barcode not found online. Enter the product name and image manually.","err")}let productName=(p.product_name_en||p.product_name||p.generic_name||"").trim(),brand=(p.brands||"").split(",")[0].trim();$("name").value=productName||brand;if(productName&&brand&&!productName.toLowerCase().includes(brand.toLowerCase()))$("name").value=brand+" "+productName;let image=p.image_front_url||p.image_url||"";$("imageUrl").value=image;showPreview();let tags=(p.categories_tags||[]).join(" ").toLowerCase(),match=categories.find(c=>tags.includes((c.name||"").toLowerCase().replace(/\s+/g,"-"))||tags.includes((c.name||"").toLowerCase()));if(match)$("category").value=match._key;$("found").classList.add("on");$("found").innerHTML='<i class="fa fa-wand-magic-sparkles"></i> Product name and image found automatically. Check the details before saving.';msg("Product name and image loaded automatically.","ok")}catch(e){$("name").focus();msg("Online lookup unavailable. Enter the name and image manually.","err")}}
function load(p){$("productId").value=p._key;$("found").classList.add("on");$("found").innerHTML='<i class="fa fa-circle-info"></i> Existing ZENTO product found. You can change its name, photo and details.';$("formTitle").textContent="Update Scanned Product";$("barcode").value=p.barcode||p.sku||"";$("itemCode").value=p.itemCode||"";$("name").value=p.name||"";$("nameDv").value=p.name_dv||"";$("category").value=p.category||"";$("imageUrl").value=p.image||"";$("description").value=p.description||"";showPreview()}
function showPreview(){let u=$("imageUrl").value.trim();$("preview").innerHTML=u?`<img src="${esc(u)}">`:'<i class="fa fa-image" style="font-size:30px"></i>'}function localPreview(){let f=$("imageFile").files[0];if(f)$("preview").innerHTML=`<img src="${URL.createObjectURL(f)}">`}
async function upload(f,code){if(!f)return $("imageUrl").value.trim();let ext=(f.name.split(".").pop()||"jpg").toLowerCase(),r=storage.ref(`products/${code}_${Date.now()}.${ext}`);await r.put(f);return r.getDownloadURL()}
async function saveProduct(){let id=$("productId").value,barcode=$("barcode").value.trim(),itemCode=$("itemCode").value.trim(),name=$("name").value.trim(),category=$("category").value;if(!barcode||!itemCode||!name||!category)return msg("Barcode, item code, name and category are required.","err");if(products.some(p=>p._key!==id&&String(p.barcode||p.sku||"")===barcode))return msg("This barcode is already used.","err");if(products.some(p=>p._key!==id&&(p.itemCode||"").toLowerCase()===itemCode.toLowerCase()))return msg("This item code is already used.","err");$("saveBtn").disabled=true;try{let old=products.find(p=>p._key===id),image=await upload($("imageFile").files[0],itemCode),data={name,name_dv:$("nameDv").value.trim(),itemCode,barcode,sku:barcode,category,gstRate,image,description:$("description").value.trim(),active:old?old.active===true:false,posDraft:old?!old.active:true,updatedAt:new Date().toISOString()};if(id)await db.ref("shop/products/"+id).update(data);else{data.price=0;data.costPrice=0;data.stock=0;data.createdAt=new Date().toISOString();let r=await db.ref("shop/products").push(data);$("productId").value=r.key}$("found").classList.add("on");$("formTitle").textContent="Update Scanned Product";msg("Saved. Open POS Products & Profit to edit price, photo or other details.","ok")}catch(e){msg(e.message,"err")}finally{$("saveBtn").disabled=false}}
function clearForm(){["productId","barcode","itemCode","name","nameDv","imageUrl","description","scanInput"].forEach(id=>$(id).value="");$("imageFile").value="";$("category").value="";$("found").classList.remove("on");$("formTitle").textContent="Add Scanned Product";showPreview();last="";$("scanInput").focus();msg("Ready for the next barcode.")}
window.addEventListener("beforeunload",stopCamera);$("scanInput").focus();
</script></body></html>
